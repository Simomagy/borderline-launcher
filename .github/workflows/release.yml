name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: self-hosted
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Load .env
        run: |
          $envFile = "F:\actions-runner\.env"
          if (Test-Path $envFile) {
            Get-Content $envFile | ForEach-Object {
              if ($_ -match "^\s*([^#][^=]+)=(.*)$") {
                $key = $matches[1].Trim()
                $val = $matches[2].Trim()
                echo "$key=$val" >> $env:GITHUB_ENV
              }
            }
          }
        shell: pwsh

      - name: Install frontend deps
        run: bun install
        env:
          CARGO_INCREMENTAL: "0"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CARGO_INCREMENTAL: "0"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Borderline Launcher ${{ github.ref_name }}"
          releaseBody: "Nuova versione disponibile."
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          tauriScript: bunx tauri
