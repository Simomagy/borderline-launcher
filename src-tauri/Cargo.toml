[package]
name = "borderline-launcher"
version = "1.3.0"
description = "Borderline RP Launcher"
authors = ["Prysma Studio"]
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "borderline_launcher_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.2", features = [] }

[dependencies]
tauri = { version = "2.11.2", features = ["tray-icon"] }
tauri-plugin-opener = "2.5.4"
tauri-plugin-updater = "2.10.1"
tauri-plugin-process = "2.3.1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
reqwest  = { version = "0.13.4", default-features = false, features = ["json", "rustls", "blocking"] }
sysinfo  = { version = "0.39.2", default-features = false, features = ["system"] }
discord-rich-presence = "1.1.0"
hmac = "0.13.0"
sha2 = "0.11.0"
hex = "0.4.3"
tokio = { version = "1.52.3", features = ["time"] }
# Verifica firma dell'allowlist anti-dump scaricata dal CDN (riusa la chiave
# minisign dell'updater). Vedi ALLOWLIST-CDN-SPEC.md.
minisign-verify = "0.2.3"
base64 = "0.22.1"

[target.'cfg(windows)'.dependencies]
winreg = "0.56.0"
windows = { version = "0.62.2", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Wdk_System_SystemInformation",
    "Win32_UI_WindowsAndMessaging",
] }

